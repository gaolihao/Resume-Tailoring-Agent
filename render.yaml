services:
  - type: web
    name: resume-tailoring-agent
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: >-
      streamlit run streamlit_app.py
      --server.port=$PORT
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      - key: PYTHON_VERSION
        value: "3.11.9"
