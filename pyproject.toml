[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-agent"
version = "0.1.0"
description = "LangGraph agent that tailors resumes to job postings for better screening match"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-google-genai>=4.0.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
resume-agent = "resume_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]